<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eaf1fb">
<title>云想Hairsalon</title>
<style>
  :root{
    --ink:#18202e; --ink2:#5b6474; --ink3:#9aa3b3;
    --brand:#2563eb; --brand2:#1d4ed8;
    --green:#16a34a; --green2:#15803d;
    --amber:#b45309; --red:#dc2626;
    --glass:rgba(255,255,255,.5);
    --glass-strong:rgba(255,255,255,.72);
    --edge:rgba(255,255,255,.65);
    --blur:blur(22px) saturate(170%);
    --shadow:0 8px 32px rgba(31,54,86,.12), 0 1px 3px rgba(31,54,86,.05);
    --hi:inset 0 1px 0 rgba(255,255,255,.75);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  html{background:linear-gradient(180deg,#eaf1fb,#e6f2f5)}
  body{
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    color:var(--ink);background:transparent;
    padding-bottom:calc(88px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust:100%;
  }
  /* 玻璃后面的环境光晕 */
  body::before{
    content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(55% 45% at 12% 8%,  rgba(99,179,237,.45), transparent 62%),
      radial-gradient(50% 42% at 88% 16%, rgba(167,139,250,.40), transparent 62%),
      radial-gradient(60% 50% at 80% 96%, rgba(52,211,153,.35), transparent 60%),
      radial-gradient(50% 40% at 22% 92%, rgba(56,189,248,.30), transparent 62%),
      linear-gradient(180deg, rgba(238,245,252,.2), rgba(232,242,247,.2));
  }

  /* 顶栏（液态玻璃） */
  header{
    position:sticky;top:0;z-index:20;
    background:var(--glass-strong);
    -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
    border-bottom:1px solid rgba(255,255,255,.55);
    box-shadow:var(--hi), 0 10px 30px rgba(31,54,86,.08);
    padding:calc(12px + env(safe-area-inset-top)) 18px 13px;
    color:var(--ink);
  }
  header .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
  h1{font-size:19px;margin:0;font-weight:800;letter-spacing:.2px;display:flex;align-items:center;gap:7px}
  .today{
    font-size:12px;color:var(--ink2);margin-top:8px;
    display:inline-flex;align-items:center;gap:5px;
    background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.65);
    padding:5px 11px;border-radius:20px;font-variant-numeric:tabular-nums;
    box-shadow:var(--hi);
  }
  header .linkbtn{
    background:rgba(255,255,255,.6);color:var(--ink);border:1px solid rgba(255,255,255,.7);
    border-radius:20px;padding:7px 14px;font-size:13.5px;font-weight:700;box-shadow:var(--hi);
  }
  header .linkbtn:active{background:rgba(255,255,255,.85)}

  main{padding:16px 12px 32px;max-width:760px;margin:0 auto}

  /* 通用玻璃卡片 */
  .card{
    background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
    border:1px solid var(--edge);border-radius:24px;padding:16px;margin-bottom:12px;
    box-shadow:var(--shadow), var(--hi);
  }
  .muted{color:var(--ink3)}
  .small{font-size:13px}
  .tiny{font-size:12px}
  .num{font-variant-numeric:tabular-nums;letter-spacing:.2px}

  /* 提醒横幅 */
  .banner{
    background:linear-gradient(135deg, rgba(255,247,230,.7), rgba(253,240,213,.7));
    -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
    border:1px solid rgba(255,255,255,.6);color:#8a5300;border-radius:18px;
    padding:13px 15px;font-size:13.5px;margin-bottom:12px;line-height:1.5;
    box-shadow:var(--hi);
  }
  .banner b{color:#a05b00}

  /* 搜索 */
  .search{position:relative;margin-bottom:12px}
  .search input{
    width:100%;padding:13px 16px 13px 42px;border-radius:18px;border:1px solid var(--edge);
    background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
    font-size:16px;outline:none;color:var(--ink);box-shadow:var(--shadow), var(--hi);
    transition:box-shadow .15s, border-color .15s;
  }
  .search input::placeholder{color:#aeb8c8}
  .search input:focus{border-color:rgba(37,99,235,.4);box-shadow:0 0 0 4px rgba(37,99,235,.15), var(--hi)}
  .search .ico{position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:16px;color:#8fa0b5}

  /* 会员卡 */
  .member{
    position:relative;overflow:hidden;display:block;width:100%;text-align:left;
    background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
    border:1px solid var(--edge);border-radius:24px;padding:15px 17px;margin:0 0 11px;
    box-shadow:var(--shadow), var(--hi);cursor:pointer;font:inherit;color:inherit;
    border-left:4px solid rgba(255,255,255,.5);transition:transform .12s, box-shadow .12s;
  }
  .member:active{transform:scale(.992)}
  .member.st-ok{border-left-color:rgba(22,163,74,.75)}
  .member.st-low{border-left-color:rgba(245,158,11,.8)}
  .member.st-empty{border-left-color:rgba(220,38,38,.75)}
  .member.st-expired{border-left-color:rgba(154,162,177,.7)}
  .member.st-none{border-left-color:rgba(37,99,235,.7)}
  .m-top{display:flex;align-items:center;gap:8px;justify-content:space-between}
  .m-name{font-size:16.5px;font-weight:800}
  .m-phone{font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
  .m-mid{display:flex;align-items:flex-end;justify-content:space-between;margin-top:9px;gap:10px}
  .m-big{font-size:30px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums;color:var(--green)}
  .m-big small{font-size:12.5px;font-weight:500;color:var(--ink3);margin-left:5px}
  .m-meta{font-size:12.5px;color:var(--ink3);text-align:right;line-height:1.5;font-variant-numeric:tabular-nums}

  /* 状态胶囊（玻璃色） */
  .pill{display:inline-flex;align-items:center;font-size:11.5px;padding:3px 11px;border-radius:20px;font-weight:700;white-space:nowrap;box-shadow:var(--hi)}
  .pill.ok{background:rgba(22,163,74,.15);color:#0f7a3e}
  .pill.low{background:rgba(245,158,11,.18);color:#b45309}
  .pill.empty{background:rgba(220,38,38,.14);color:#c62828}
  .pill.expired{background:rgba(154,162,177,.18);color:#6b7280}
  .pill.none{background:rgba(37,99,235,.14);color:#1d4ed8}

  /* 按钮 */
  .btn{
    position:relative;overflow:hidden;
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    border:0;border-radius:16px;padding:12px 18px;font:inherit;font-weight:800;font-size:15px;
    cursor:pointer;text-decoration:none;transition:transform .1s, box-shadow .15s;
  }
  .btn:active{transform:translateY(1px) scale(.99)}
  .btn.primary{
    background:linear-gradient(135deg, rgba(37,99,235,.94), rgba(29,78,216,.94));color:#fff;
    box-shadow:0 10px 24px rgba(37,99,235,.35), inset 0 1px 0 rgba(255,255,255,.4);
  }
  .btn.green{
    background:linear-gradient(135deg, rgba(34,197,94,.94), rgba(21,128,61,.94));color:#fff;
    box-shadow:0 10px 24px rgba(22,163,74,.35), inset 0 1px 0 rgba(255,255,255,.4);
  }
  .btn.ghost{background:rgba(255,255,255,.55);color:var(--ink);border:1px solid var(--edge);box-shadow:var(--hi)}
  .btn.danger{background:rgba(220,38,38,.12);color:#c62828;border:1px solid rgba(220,38,38,.18)}
  .btn.block{width:100%}
  .btn.big{padding:16px;font-size:17px;border-radius:18px}
  .btn-row{display:flex;gap:10px}
  .btn-row .btn{flex:1}
  .linkbtn{background:none;border:0;color:var(--brand);font:inherit;font-size:14px;font-weight:700;padding:8px 4px;cursor:pointer}

  /* 明细 */
  .rec{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.5)}
  .rec:last-child{border-bottom:0}
  .rec .ic{width:38px;height:38px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 38px;box-shadow:var(--hi)}
  .rec .ic.in{background:rgba(22,163,74,.15)}
  .rec .ic.out{background:rgba(37,99,235,.14)}
  .rec .body{flex:1;min-width:0}
  .rec .t1{font-size:14.5px;font-weight:700}
  .rec .t2{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
  .rec .amt{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
  .rec .amt.in{color:#0f7a3e}
  .rec .amt.out{color:var(--brand)}
  .delrec{border:0;background:none;color:#aeb8c8;font-size:16px;padding:6px;cursor:pointer}

  .daygroup{margin-bottom:6px}
  .dayhead{font-size:12.5px;color:var(--ink3);font-weight:700;padding:12px 6px 6px;display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}

  /* 统计 */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .stat{
    position:relative;overflow:hidden;border-radius:24px;padding:17px;
    background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
    border:1px solid var(--edge);box-shadow:var(--shadow), var(--hi);
  }
  .stat::after{content:'';position:absolute;top:-26px;right:-26px;width:92px;height:92px;border-radius:50%;background:radial-gradient(circle, rgba(37,99,235,.16), transparent 70%)}
  .stat .k{font-size:12.5px;color:var(--ink3);font-weight:600}
  .stat .v{font-size:27px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums;color:var(--ink)}
  .stat .v small{font-size:13px;font-weight:500;color:var(--ink3);margin-left:3px}

  /* 底部导航（流动液态玻璃） */
  nav{
    position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;
    padding:5px;border-radius:28px;overflow:hidden;
    background:rgba(255,255,255,.55);
    -webkit-backdrop-filter:blur(26px) saturate(185%);backdrop-filter:blur(26px) saturate(185%);
    border:1px solid var(--edge);
    box-shadow:0 16px 44px rgba(31,54,86,.22), var(--hi);
  }
  /* 流动的光泽，缓缓扫过整条导航 */
  nav::before{
    content:'';position:absolute;inset:0;pointer-events:none;border-radius:28px;
    background:linear-gradient(105deg, rgba(255,255,255,0) 32%, rgba(255,255,255,.55) 47%, rgba(255,255,255,0) 62%);
    background-size:260% 100%;
    animation:navflow 7s linear infinite;
  }
  @keyframes navflow{0%{background-position:135% 0}100%{background-position:-135% 0}}

  .nav-inner{position:relative;display:flex}
  /* 流动的玻璃镜头：随当前标签滑动 */
  .nav-lens{
    position:absolute;top:2px;bottom:2px;left:0;width:25%;border-radius:23px;
    background:linear-gradient(160deg, rgba(255,255,255,.92), rgba(255,255,255,.55));
    border:1px solid rgba(255,255,255,.9);
    box-shadow:0 6px 18px rgba(31,54,86,.18), inset 0 1px 0 #fff, inset 0 -3px 8px rgba(37,99,235,.10);
    transition:transform .5s cubic-bezier(.34,1.4,.5,1), opacity .25s;
    z-index:0;pointer-events:none;
  }
  .nav-lens::after{
    content:'';position:absolute;inset:0;border-radius:23px;
    background:radial-gradient(120% 65% at 50% 0%, rgba(37,99,235,.18), transparent 72%);
    animation:lenspulse 4.5s ease-in-out infinite;
  }
  @keyframes lenspulse{0%,100%{opacity:.5}50%{opacity:1}}

  nav button{
    position:relative;z-index:1;flex:1;border:0;background:none;padding:9px 0 10px;font-size:11px;color:var(--ink3);
    display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit;cursor:pointer;
    overflow:hidden;border-radius:22px;
  }
  nav .ic{
    width:38px;height:28px;display:flex;align-items:center;justify-content:center;
    font-size:20px;line-height:1;border-radius:12px;transition:transform .28s cubic-bezier(.34,1.4,.5,1);
  }
  nav button.on{color:var(--brand);font-weight:800}
  nav button.on .ic{transform:scale(1.1)}

  /* 按压涟漪 */
  .ripple{
    position:absolute;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle, currentColor 0%, transparent 65%);
    opacity:.22;transform:translate(-50%,-50%) scale(0);
    animation:rip .55s cubic-bezier(.22,.61,.36,1) forwards;
  }
  @keyframes rip{to{transform:translate(-50%,-50%) scale(1);opacity:0}}

  /* 开关 */
  .switch{
    width:52px;height:32px;border-radius:16px;border:0;flex:0 0 52px;position:relative;cursor:pointer;
    background:rgba(120,132,152,.32);transition:background .22s;
  }
  .switch::after{
    content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;
    box-shadow:0 2px 6px rgba(0,0,0,.22);transition:transform .24s cubic-bezier(.34,1.56,.64,1);
  }
  .switch.on{background:var(--green)}
  .switch.on::after{transform:translateX(20px)}

  /* 弹层 */
  .overlay{position:fixed;inset:0;z-index:50;background:rgba(20,30,50,.35);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center}
  .sheet{
    width:100%;max-width:560px;border-radius:28px 28px 0 0;
    background:rgba(255,255,255,.78);
    -webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);
    border:1px solid var(--edge);border-bottom:0;
    padding:8px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;
    animation:up .22s cubic-bezier(.2,.8,.3,1);box-shadow:var(--hi);
  }
  .sheet::before{content:'';display:block;width:42px;height:5px;border-radius:3px;background:rgba(120,132,152,.28);margin:7px auto 13px}
  @keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
  .sheet h2{font-size:18px;margin:2px 0 14px;font-weight:800}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;color:var(--ink2);font-weight:700;margin-bottom:6px}
  .field input,.field textarea{
    width:100%;padding:12px 13px;border:1px solid var(--edge);border-radius:14px;font-size:16px;
    font-family:inherit;outline:none;color:var(--ink);
    background:rgba(255,255,255,.6);box-shadow:var(--hi);
    transition:border-color .15s, box-shadow .15s, background .15s;
  }
  .field input::placeholder,.field textarea::placeholder{color:#aeb8c8}
  .field input:focus,.field textarea:focus{border-color:rgba(37,99,235,.45);background:#fff;box-shadow:0 0 0 4px rgba(37,99,235,.15), var(--hi)}
  .field .hint{font-size:12px;color:var(--ink3);margin-top:6px}
  .field-2{display:flex;gap:10px}
  .field-2>.field{flex:1}
  .sheet .actions{display:flex;gap:10px;margin-top:8px}
  .sheet .actions .btn{flex:1}
  textarea{resize:vertical}

  .empty{text-align:center;color:var(--ink3);padding:46px 12px;font-size:14px;line-height:1.7}
  .empty .em{
    font-size:26px;display:flex;align-items:center;justify-content:center;
    width:78px;height:78px;margin:0 auto 14px;border-radius:50%;
    background:rgba(255,255,255,.55);border:1px solid var(--edge);box-shadow:var(--hi);
  }
  .sep{height:1px;background:rgba(255,255,255,.55);margin:14px 0}
  .kv{display:flex;justify-content:space-between;padding:8px 0;font-size:14.5px}
  .kv span:first-child{color:var(--ink2)}
  .kv span:last-child{font-variant-numeric:tabular-nums;font-weight:700}

  /* 会员详情 */
  .detail-head .dh-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .dh-title{font-size:21px;font-weight:800;letter-spacing:.3px}
  .dh-sub{font-size:13px;color:var(--ink3);margin-top:3px;font-variant-numeric:tabular-nums}
  .dh-note{font-size:12px;color:var(--ink2);margin-top:6px;background:rgba(255,255,255,.55);display:inline-block;padding:2px 10px;border-radius:9px;border:1px solid var(--edge)}
  .dh-remain{
    --ring:#aeb8c8;--ring-soft:rgba(174,184,200,.18);
    width:160px;height:160px;border-radius:50%;margin:16px auto 0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    border:1px solid var(--edge);
    background:var(--ring-soft);
    box-shadow:var(--hi), 0 0 0 5px rgba(255,255,255,.35);
  }
  .dh-remain.ok{--ring:#16a34a;--ring-soft:rgba(22,163,74,.14)}
  .dh-remain.low{--ring:#f59e0b;--ring-soft:rgba(245,158,11,.16)}
  .dh-remain.empty{--ring:#dc2626;--ring-soft:rgba(220,38,38,.13)}
  .dh-remain.expired{--ring:#9aa2b1;--ring-soft:rgba(154,162,177,.16)}
  .dh-remain.none{--ring:#2563eb;--ring-soft:rgba(37,99,235,.13)}
  .dh-num{font-size:56px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--ring)}
  .dh-unit{font-size:13px;color:var(--ink3);margin-top:4px}
  .dh-hint{text-align:center;font-size:12.5px;color:var(--ink3);margin-top:13px}

  /* 兜底 & 出错 */
  #fallback{position:fixed;inset:0;z-index:900;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(180deg,#eaf1fb,#e6f2f5)}
  #fallback .fb-card{
    background:var(--glass-strong);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
    border:1px solid var(--edge);border-radius:24px;padding:26px;max-width:420px;box-shadow:var(--shadow), var(--hi);
  }
  #fallback .fb-title{font-size:20px;font-weight:800;margin-bottom:6px}
  #fallback .fb-sub{font-size:13.5px;color:var(--ink3);margin-bottom:14px}
  #fallback .fb-tip{font-size:14px;line-height:1.8;color:var(--ink2)}
  #fallback .fb-tip b{color:#a11}
  #fallback .fb-dots:after{content:'…';display:inline-block;animation:dots 1.2s steps(4,end) infinite;width:1em;text-align:left}
  @keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
</style>
</head>
<body>
<div id="root"></div>
<div id="fallback">
  <div class="fb-card">
    <div class="fb-title">云想Hairsalon</div>
    <div class="fb-sub fb-dots">正在加载</div>
    <div class="fb-tip">
      如果这行字停留超过 3 秒，说明<b>当前打开方式只显示网页、不执行 JavaScript</b>，
      记账界面就出不来（你看到的白屏就是这个原因）。<br><br>
      请改用电脑上的 <b>Chrome / Edge / Safari</b> 打开这个文件（双击即可），
      或者把这个文件发到微信「文件传输助手」，在电脑上另存后打开。
    </div>
  </div>
</div>
<noscript>
  <div style="position:fixed;inset:0;z-index:950;background:#fff;padding:24px;font-size:14px;line-height:1.8">
    这个页面需要 JavaScript 才能显示。请用浏览器打开（电脑上双击文件即可）。
  </div>
</noscript>
<script>
'use strict';

/* ============ 一、基础工具 ============ */
var KEY = 'hairshop.v1';

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function pad2(n){ return (n < 10 ? '0' : '') + n; }
function todayStr(){
  var d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
}
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function money(n){
  n = Number(n) || 0;
  var r = Math.round(n * 100) / 100;
  return (r % 1 === 0) ? String(r) : r.toFixed(2);
}
function addYears(dateStr, y){
  var p = dateStr.split('-');
  return (Number(p[0]) + y) + '-' + p[1] + '-' + p[2];
}
function daysBetween(a, b){   /* b - a，单位天 */
  var da = new Date(a + 'T00:00:00'), db = new Date(b + 'T00:00:00');
  return Math.round((db - da) / 86400000);
}
function weekdayName(ds){
  var d = new Date(ds + 'T00:00:00');
  var w = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  return ds + ' ' + w;
}

/* ---------- 按键音效（Web Audio，合成音，无需音频文件） ---------- */
var Sound = (function(){
  var ctx = null;
  var on = true;
  try{ on = localStorage.getItem('hairshop.sound') !== '0'; }catch(e){}

  function ensure(){
    if(!ctx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      try{ ctx = new AC(); }catch(e){ return null; }
    }
    if(ctx.state === 'suspended'){ try{ ctx.resume(); }catch(e){} }
    return ctx;
  }
  function tone(freq, dur, type, vol){
    if(!on) return;
    var c = ensure();
    if(!c) return;
    try{
      var o = c.createOscillator(), g = c.createGain();
      o.type = type || 'sine';
      o.frequency.value = freq;
      o.connect(g); g.connect(c.destination);
      var t = c.currentTime;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.start(t); o.stop(t + dur + 0.02);
    }catch(e){}
  }
  return {
    tap: function(){ tone(920, 0.05, 'sine', 0.035); },
    ok:  function(){ tone(680, 0.07, 'sine', 0.05); setTimeout(function(){ tone(1020, 0.09, 'sine', 0.04); }, 60); },
    isOn: function(){ return on; },
    setOn: function(v){ on = !!v; try{ localStorage.setItem('hairshop.sound', on ? '1' : '0'); }catch(e){} if(on) ensure(); }
  };
})();

/* ---------- 按压涟漪 ---------- */
function rippleAt(ev, el){
  try{
    var rect = el.getBoundingClientRect();
    var x = (typeof ev.clientX === 'number' && ev.clientX ? ev.clientX : rect.left + rect.width / 2) - rect.left;
    var y = (typeof ev.clientY === 'number' && ev.clientY ? ev.clientY : rect.top + rect.height / 2) - rect.top;
    var size = Math.max(rect.width, rect.height) * 1.8;
    var r = document.createElement('span');
    r.className = 'ripple';
    r.style.left = x + 'px';
    r.style.top = y + 'px';
    r.style.width = size + 'px';
    r.style.height = size + 'px';
    el.appendChild(r);
    setTimeout(function(){ if(r.parentNode) r.parentNode.removeChild(r); }, 560);
  }catch(e){}
}

function haptic(ms){

}

    }

}

    if(state.customers[i].id === id) return state.customers[i];
  }

/* 单个会员的完整汇总 */
function summarize(c){
  var rs = recsOf(c.id);
  var total = 0, used = 0, amount = 0, expire = '', last = '', lastRecharge = '';
  for(var i=0;i<rs.length;i++){
    var r = rs[i];
    if(r.type === 'recharge'){
      total += (Number(r.count) || 0);
      amount += (Number(r.amount) || 0);
      if(r.expireDate && r.expireDate > expire) expire = r.expireDate;
      if(r.date > lastRecharge) lastRecharge = r.date;
    }else if(r.type === 'use'){
      used += (Number(r.count) || 0);
    }
    if(r.date > last) last = r.date;
  }
  var remain = total - used;
  var t = todayStr();
  var status;
  if(total === 0) status = 'none';
  else if(expire && expire < t) status = 'expired';
  else if(remain <= 0) status = 'empty';
  else if(remain <= 2) status = 'low';
  else status = 'ok';
  return {
    id: c.id, name: c.name, phone: c.phone, note: c.note,
    total: total, used: used, remain: remain, amount: amount,
    expire: expire, last: last, lastRecharge: lastRecharge,
    status: status, count: rs.length,
    sortKey: last || (c.createdAt || '').slice(0,10) || ''
  };
}
function allMembers(){
  return state.customers.map(summarize);
}
function statusLabel(s){
  return {ok:'正常', low:'快用完', empty:'已用完', expired:'已过期', none:'未开卡'}[s] || '';
}
function statusText(ms){
  var t = todayStr();
  if(ms.status === 'none') return '还没充值过';
  if(ms.status === 'expired'){
    var d = daysBetween(ms.expire, t);
    return '卡已过期 ' + d + ' 天（剩 ' + ms.remain + ' 次）';
  }
  if(ms.status === 'empty') return '次数已用完，该提醒续卡了';
  if(ms.status === 'low') return '只剩 ' + ms.remain + ' 次';
  if(ms.expire){
    var left = daysBetween(t, ms.expire);
    if(left <= 30) return left + ' 天后到期（剩 ' + ms.remain + ' 次）';
  }
  return '剩 ' + ms.remain + ' 次';
}

function stats(){
  var t = todayStr(), m = t.slice(0,7);
  var o = {
    todayRecharge: 0, todayUse: 0,
    monthRecharge: 0, monthUse: 0, monthCust: 0,
    totalRecharge: 0, totalUse: 0
  };
  var seen = {};
  for(var i=0;i<state.records.length;i++){
    var r = state.records[i];
    var amt = Number(r.amount) || 0, cnt = Number(r.count) || 0;
    if(r.type === 'recharge'){
      o.totalRecharge += amt;
      if(r.date.slice(0,7) === m){ o.monthRecharge += amt; if(!seen[r.cid]){ seen[r.cid]=1; o.monthCust++; } }
      if(r.date === t) o.todayRecharge += amt;
    }else{
      o.totalUse += cnt;
      if(r.date.slice(0,7) === m) o.monthUse += cnt;
      if(r.date === t) o.todayUse += cnt;
    }
  }
  return o;
}

      h += '<div class="field-2">' +
        '<div class="field"><label>开卡日期</label><input id="f_date" type="date" value="' + todayStr() + '"></div>' +
        '<div class="field"><label>有效期至</label><input id="f_expire" type="date" value="' + addYears(todayStr(), 1) + '"></div>' +
      '</div>';
      h += '<div class="tiny muted" style="margin:-4px 0 12px">现在不充值也可以，先建个空档案，改天再点「充值」。</div>';
    }
    h += '<div class="actions">' +
      '<button class="btn ghost" data-act="closemodal">取消</button>' +
      '<button class="btn primary" data-act="submit" data-kind="' + md.kind + '">保存</button>' +
    '</div>';
    return h;
  }

  if(md.kind === 'recharge'){
    h += '<h2>给「' + esc(c.name) + '」充值</h2>';
    h += '<div class="field-2">' +
      '<div class="field"><label>充值金额（元）</label><input id="f_amount" type="number" inputmode="decimal" placeholder="如 300"></div>' +
      '<div class="field"><label>增加次数</label><input id="f_count" type="number" inputmode="numeric" placeholder="如 10"></div>' +
    '</div>';
    h += '<div class="field-2">' +
      '<div class="field"><label>日期</label><input id="f_date" type="date" value="' + todayStr() + '"></div>' +
      '<div class="field"><label>有效期至（可改）</label><input id="f_expire" type="date" value="' + (summarize(c).expire || addYears(todayStr(),1)) + '"></div>' +
    '</div>';
    h += '<div class="tiny muted" style="margin:-4px 0 12px">次数会累加到现有余额上。</div>';
    h += '<div class="actions">' +
      '<button class="btn ghost" data-act="closemodal">取消</button>' +
      '<button class="btn primary" data-act="submit" data-kind="recharge">确认充值</button>' +
    '</div>';
    return h;
  }
  return '';
}

/* ============ 五之二、底部导航（流动液态玻璃） ============ */
var NAV_ITEMS = [['members','👥','会员'], ['flow','🧾','流水'], ['stats','📊','统计'], ['settings','⚙️','设置']];

function navIndex(){
  if(ui.openId) return -1;
  for(var i=0;i<NAV_ITEMS.length;i++){
    if(NAV_ITEMS[i][0] === ui.tab) return i;
  }
  return 0;
}
/* 导航只创建一次，之后只更新状态 —— 这样玻璃镜头才能平滑滑动 */
function ensureNav(){
  var nav = document.getElementById('bottomnav');
  if(nav) return nav;
  nav = document.createElement('nav');
  nav.id = 'bottomnav';
  var h = '<div class="nav-inner"><div class="nav-lens"></div>';
  for(var i=0;i<NAV_ITEMS.length;i++){
    var it = NAV_ITEMS[i];
    h += '<button type="button" data-act="tab" data-tab="' + it[0] + '">' +
         '<span class="ic">' + it[1] + '</span><span>' + it[2] + '</span></button>';
  }
  h += '</div>';
  nav.innerHTML = h;
  document.body.appendChild(nav);
  return nav;
}
function syncNav(){
  var nav = ensureNav();
  var idx = navIndex();
  var btns = nav.querySelectorAll('button');
  for(var i=0;i<btns.length;i++){
    if(i === idx){ btns[i].classList.add('on'); } else { btns[i].classList.remove('on'); }
  }
  var lens = nav.querySelector('.nav-lens');
  if(!lens) return;
  if(idx < 0){ lens.style.opacity = '0'; return; }
  lens.style.opacity = '1';
  lens.style.width = (100 / NAV_ITEMS.length) + '%';
  lens.style.transform = 'translateX(' + (idx * 100) + '%)';
}

/* ============ 六、渲染 ============ */
function fullRender(){
  var root = document.getElementById('root');
  if(!root) return;
  var body = '';
  if(ui.openId){ body = detailView(); }
  else if(ui.tab === 'members'){ body = membersView(); }
  else if(ui.tab === 'flow'){ body = flowView(); }
  else if(ui.tab === 'stats'){ body = statsView(); }
  else { body = settingsView(); }

  if(!storageOK){
    body = '<div class="banner" style="background:#fdecec;border-color:#f5b5b5;color:#a11">' +
      '<b>这个打开方式不能保存数据</b><br>关掉后数据会丢。请在电脑上用浏览器打开这个文件。' +
    '</div>' + body;
  }

  var overlay = '';
  var mv = modalView();
  if(mv){
    overlay = '<div class="overlay" data-act="overlaytap"><div class="sheet" data-stop="1">' + mv + '</div></div>';
  }

  var keepQ = document.activeElement && document.activeElement.id === 'q';
  var selStart = keepQ ? document.activeElement.selectionStart : 0;

  root.innerHTML = topBar() + '<main>' + body + '</main>' + overlay;
  syncNav();

  if(keepQ){
    var qi = document.getElementById('q');
    if(qi){ qi.focus(); try{ qi.setSelectionRange(selStart, selStart); }catch(e){} }
  }
  /* 打开弹层时自动聚焦第一个输入框 */
  if(mv){
    var first = document.querySelector('.sheet input');
    if(first && !('ontouchstart' in window)) first.focus();
  }
}

/* ============ 七、动作 ============ */
function addRecord(cid, type, count, amount, date, expireDate){
  state.records.push({
    id: uid(), cid: cid, type: type,
    count: Number(count) || 0, amount: Number(amount) || 0,
    date: date || todayStr(), expireDate: (type === 'recharge' ? (expireDate || '') : ''),
    ts: Date.now()
  });
}

function doSubmit(kind){
  var g = function(id){ var el = document.getElementById(id); return el ? el.value.trim() : ''; };

  if(kind === 'add'){
    var name = g('f_name');
    if(!name){ alert('请填写姓名'); return; }
    var c = { id: uid(), name: name, phone: g('f_phone'), note: g('f_note'), createdAt: new Date().toISOString() };
    state.customers.push(c);
    var amt = num(g('f_amount')), cnt = intNum(g('f_count'));
    if(amt > 0 || cnt > 0){
      addRecord(c.id, 'recharge', cnt, amt, g('f_date') || todayStr(), g('f_expire'));
    }
    ui.modal = null; ui.openId = c.id;
    save(); fullRender(); return;
  }

  if(kind === 'edit'){
    var c2 = findCustomer(ui.modal.cid);
    if(!c2) return;
    var nm = g('f_name');
    if(!nm){ alert('请填写姓名'); return; }
    c2.name = nm; c2.phone = g('f_phone'); c2.note = g('f_note');
    ui.modal = null; save(); fullRender(); return;
  }

  if(kind === 'recharge'){
    var c3 = findCustomer(ui.modal.cid);
    if(!c3) return;
    var a3 = num(g('f_amount')), n3 = intNum(g('f_count'));
    if(a3 <= 0 && n3 <= 0){ alert('金额和次数至少填一个'); return; }
    if(n3 <= 0){ n3 = 0; }
    addRecord(c3.id, 'recharge', n3, a3, g('f_date') || todayStr(), g('f_expire'));
    ui.modal = null; save(); fullRender(); return;
  }
}

function downloadBackup(){
  var data = JSON.stringify({ app: 'hairshop', version: 1, exportedAt: new Date().toISOString(), customers: state.customers, records: state.records }, null, 2);
  try{
    var blob = new Blob([data], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = '理发店备份-' + todayStr() + '.json';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); if(a.parentNode) a.parentNode.removeChild(a); }, 1500);
  }catch(e){
    alert('这台设备不支持直接下载，请用「复制备份文本」然后粘贴到备忘录保存。');
  }
}

function copyBackup(){
  var data = JSON.stringify({ app: 'hairshop', version: 1, exportedAt: new Date().toISOString(), customers: state.customers, records: state.records });
  var done = function(){ alert('备份文本已复制。粘到备忘录或微信收藏里存好。'); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(data).then(done, function(){ fallbackCopy(data, done); });
  }else{
    fallbackCopy(data, done);
  }
}
function fallbackCopy(text, done){
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  var ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  if(ok) done(); else alert('复制失败，请用「导出备份文件」。');
}

function applyImport(text){
  var s;
  try{ s = JSON.parse(text); }catch(e){ alert('这段内容不是有效的备份文件'); return; }
  if(!s || !Array.isArray(s.customers) || !Array.isArray(s.records)){ alert('备份内容格式不对'); return; }
  if(!confirm('将用备份覆盖当前的 ' + state.customers.length + ' 位客户和 ' + state.records.length + ' 条记录，确定吗？')) return;
  state = { customers: s.customers, records: s.records };
  save(); ui.openId = null; ui.modal = null;
  fullRender();
  alert('已恢复：' + state.customers.length + ' 位客户，' + state.records.length + ' 条记录。');
}

document.addEventListener('click', function(ev){
  var t = ev.target;
  if(ev.target.classList && ev.target.classList.contains('overlay')){ ui.modal = null; fullRender(); return; }
  var b = t && t.closest ? t.closest('[data-act]') : null;
  if(!b) return;
  var act = b.getAttribute('data-act');
  if(act === 'overlaytap') return;   /* 点遮罩空白处关闭，由上面的判断处理 */

  /* 按压反馈：音效 + 涟漪 + 触感 */
  Sound.tap();
  haptic(7);
  rippleAt(ev, b);

  if(act === 'togsound'){ Sound.setOn(!Sound.isOn()); if(Sound.isOn()) Sound.ok(); fullRender(); return; }
  if(act === 'tab'){ ui.tab = b.getAttribute('data-tab'); ui.openId = null; fullRender(); return; }
  if(act === 'back'){ ui.openId = null; fullRender(); return; }
  if(act === 'open'){ ui.openId = b.getAttribute('data-id'); ui.tab = 'members'; fullRender(); return; }
  if(act === 'add'){ ui.modal = { kind: 'add' }; fullRender(); return; }
  if(act === 'edit'){ ui.modal = { kind: 'edit', cid: b.getAttribute('data-id') }; fullRender(); return; }
  if(act === 'recharge'){ ui.modal = { kind: 'recharge', cid: b.getAttribute('data-id') }; fullRender(); return; }
  if(act === 'closemodal'){ ui.modal = null; fullRender(); return; }
  if(act === 'submit'){ doSubmit(b.getAttribute('data-kind')); return; }

  if(act === 'use'){
    var cid = b.getAttribute('data-id');
    var c = findCustomer(cid);
    if(!c) return;
    var m = summarize(c);
    if(m.status === 'expired' && !confirm('这位客户的卡在 ' + m.expire + ' 已过期，还要扣次数吗？')) return;
    addRecord(cid, 'use', 1, 0, todayStr(), '');
    Sound.ok(); haptic(18);   /* 扣次成功的提示音 */
    save(); fullRender();
    return;
  }

  if(act === 'delrec'){
    var rid = b.getAttribute('data-id');
    if(!confirm('删除这条记录？剩余次数会相应改回。')) return;
    state.records = state.records.filter(function(r){ return r.id !== rid; });
    save(); fullRender(); return;
  }

  if(act === 'delcus'){
    var did = b.getAttribute('data-id');
    var cu = findCustomer(did);
    if(!cu) return;
    if(!confirm('删除「' + cu.name + '」和他的全部记录？此操作不可恢复。')) return;
    state.customers = state.customers.filter(function(x){ return x.id !== did; });
    state.records = state.records.filter(function(r){ return r.cid !== did; });
    ui.openId = null; save(); fullRender(); return;
  }

  if(act === 'export'){ downloadBackup(); return; }
  if(act === 'copy'){ copyBackup(); return; }
  if(act === 'importfile'){ var fi = document.getElementById('filein'); if(fi) fi.click(); return; }
  if(act === 'pasteimport'){
    var ta = document.getElementById('pastebox');
    if(!ta || !ta.value.trim()){ alert('请先粘贴备份文本'); return; }
    applyImport(ta.value.trim()); return;
  }
  if(act === 'wipe'){
    if(!confirm('确定清空全部数据？建议先导出备份。')) return;
    if(!confirm('再确认一次：' + state.customers.length + ' 位客户、' + state.records.length + ' 条记录将被删除。')) return;
    state = { customers: [], records: [] };
    save(); ui.openId = null; ui.tab = 'members'; fullRender(); return;
  }
});

document.addEventListener('change', function(ev){
  if(ev.target && ev.target.id === 'filein'){
    var f = ev.target.files && ev.target.files[0];
    if(!f) return;
    var rd = new FileReader();
    rd.onload = function(){ applyImport(String(rd.result || '')); };
    rd.readAsText(f);
  }
  if(ev.target && ev.target.id === 'f_date'){ /* 日期改动无需重绘 */ }
});

/* 搜索输入 */
document.addEventListener('input', function(ev){
  if(ev.target && ev.target.id === 'q'){
    ui.q = ev.target.value;
    var root = document.getElementById('root');
    if(!root) return;
    /* 只重绘列表区，保持输入焦点 */
    var list = allMembers();
    var k = ui.q.trim().toLowerCase();
    if(k){
      list = list.filter(function(m){
        return (m.name||'').toLowerCase().indexOf(k) >= 0 || (m.phone||'').indexOf(k) >= 0;
      });
    }
    list.sort(function(a,b){ return a.sortKey < b.sortKey ? 1 : a.sortKey > b.sortKey ? -1 : 0; });
    var main = document.querySelector('main');
    if(main){
      var old = main.querySelectorAll('.member, .empty');
      for(var i=0;i<old.length;i++) old[i].remove();
      var html = '';
      if(!list.length){
        html = '<div class="empty"><span class="em">🔍</span>没找到匹配的客户</div>';
      }else{
        list.forEach(function(m){
          html = html + '<button class="member st-' + m.status + '" data-act="open" data-id="' + m.id + '">' +
            '<div class="m-top"><span class="m-name">' + esc(m.name) + (m.phone ? ' <span class="m-phone">' + esc(m.phone) + '</span>' : '') + '</span>' +
            '<span class="pill ' + m.status + '">' + statusLabel(m.status) + '</span></div>' +
            '<div class="m-mid"><div class="m-big num">' + (m.status === 'none' ? '—' : m.remain) +
            '<small>' + (m.status === 'none' ? '' : '次可用') + '</small></div>' +
            '<div class="m-meta">共 ' + m.total + ' 次 · 充值 ' + money(m.amount) + ' 元' +
            (m.expire ? '<br>到期 ' + m.expire : '') + '</div></div></button>';
        });
      }
      main.insertAdjacentHTML('beforeend', html);
    }
  }
});

/* ============ 八、自检与启动 ============ */
function fatal(msg){
  var d = document.getElementById('fatal');
  if(!d){
    d = document.createElement('div');
    d.id = 'fatal';
    d.style.cssText = 'position:fixed;inset:0;z-index:999;background:#fff;padding:24px;font-size:14px;line-height:1.7;color:#a11;overflow:auto';
    document.body.appendChild(d);
  }
  d.innerHTML = '<b style="font-size:16px">页面出错了</b><br><br>' +
    '把下面这句话截图发给我，我就能改好：<br>' +
    '<code style="display:block;background:#f4f4f7;padding:10px;border-radius:8px;margin-top:8px;color:#333;word-break:break-all">' +
    String(msg).replace(/[<>&]/g, '') + '</code>';
  d.style.display = 'block';
  var fb = document.getElementById('fallback');
  if(fb) fb.style.display = 'none';
}

if(typeof document !== 'undefined' && document.getElementById('root')){
  try{
    fullRender();
    var fb0 = document.getElementById('fallback');
    if(fb0) fb0.style.display = 'none';   /* 只要 JS 跑起来了就撤掉兜底提示 */
  }catch(e){
    fatal((e && (e.stack || e.message)) || e);
  }
  window.addEventListener('error', function(ev){
    fatal(ev.message + ' @' + (ev.lineno || '') + ':' + (ev.colno || ''));
  });
}
if(typeof module !== 'undefined' && module.exports){
  module.exports = { summarize: summarize, stats: stats, state: state, addRecord: addRecord, money: money, daysBetween: daysBetween };
}
</script>
